<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            background: url('images/cover.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 15px;
        }

        .hero h1 {
            font-size: 3rem;
        }

        .hero p {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00adb5;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* SECTION */
        section {
            padding: 60px 20px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* ABOUT */
        .about {
            max-width: 800px;
            margin: auto;
            line-height: 1.6;
        }

        /* GALLERY */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .card {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        img, video {
            width: 100%;
            border-radius: 10px;
        }

        /* FOOTER */
        footer {
            padding: 20px;
            background: #111;
        }
    </style>
</head>
<body>

<!-- HERO -->
<div class="hero">
    <div class="hero-content">
        <h1>Hello, I'm Orochi</h1>
        <p>I build, capture, and share my work</p>
        <a href="#gallery">
            <button class="btn">View My Work</button>
        </a>
    </div>
</div>

<!-- ABOUT -->
<section id="about">
    <h2>About Me</h2>
    <div class="about">
        <p>
            I'm a developer who enjoys building applications and documenting my journey
            through screenshots and videos. This site is where I showcase my work,
            experiments, and ideas.
        </p>
    </div>
</section>

<!-- GALLERY -->
<section id="gallery">
    <h2>My Work</h2>

    <div class="gallery">

        <div class="card">
            <img src="images/screenshot1.png" alt="">
        </div>

        <div class="card">
            <img src="images/screenshot2.jpg" alt="">
        </div>

        <div class="card">
            <video controls>
                <source src="videos/demo1.mp4" type="video/mp4">
            </video>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 Orochi | Hosted on Azure</p>
</footer>

</body>
</html>
